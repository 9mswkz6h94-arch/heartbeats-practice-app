# Netlify builds and publishes the practice site and its server functions from main.
name: Validate practice app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      REACT_APP_REVIEW_DATA_MODE: mock-isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:validate
