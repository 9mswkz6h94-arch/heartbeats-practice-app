    <path d="M19 20h3v3h-3v-3zm23 0h3v3h-3v-3z"/>
    <path d="M30 23h4v3h-4v-3zm-3 4h3v2h4v-2h3v3H27v-3z"/>
  </g>

  <!-- One dark sound hole with exactly three visible strings. -->
  <path fill="#201923" d="M24 39h16v11H24V39z"/>
  <g fill="#FFD27A">
    <path d="M27 38h2v14h-2V38zm4 0h2v14h-2V38zm4 0h2v14h-2V38z"/>
