    <path d="M23 39h18v11H23V39z"/>
  </g>

  <!-- Coral fox body. -->
  <g fill="#E86F21">
    <path d="M13 16h38v10h-4v4H17v-4h-4V16z"/>
    <path d="M18 31h28v3h4v7h2v7h-5v10h-6v-9H23v9h-7V48h-4v-7h3v-7h3v-3z"/>
    <path d="M50 32h3v-3h2v9h-5v-6z"/>
  </g>

  <!-- Cream face, resonator rim, muzzle, ear highlights, and toes. -->
  <g fill="#FFD27A">
    <path d="M15 7h3v8h-3V7zm31 0h3v8h-3V7z"/>
    <path d="M17 18h8v7h-8v-7zm22 0h8v7h-8v-7z"/>
    <path d="M24 23h16v6H24v-6z"/>
    <path d="M21 35h22v3h3v14h-5v3H23v-3h-4V38h2v-3z"/>
    <path d="M16 55h7v3h-7v-3zm25 0h7v3h-7v-3z"/>
