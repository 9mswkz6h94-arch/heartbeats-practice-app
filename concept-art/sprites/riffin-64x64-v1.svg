<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Four-color production palette: #201923 #7A321C #E86F21 #FFD27A -->
  <!-- Outline and silhouette: tall ears, compact stance, and tuning-peg tail. -->
  <g fill="#201923">
    <path d="M10 3h12v3h3v7h14V6h3V3h12v18h-3v7h-4v4H17v-4h-4v-7h-3V3z"/>
    <path d="M17 30h30v3h5v7h3v9h-4v10H39v-8H25v8H13V49H9v-9h3v-7h5v-3z"/>
    <path d="M48 31h5v-4h3v-4h3v-2h3v5h-2v3h3v4h-3v3h3v4h-3v4h-6v-3h-6V31z"/>
  </g>

  <!-- Dark wood: inner ears, paws, sound hole, and guitar-neck tail. -->
  <g fill="#7A321C">
    <path d="M13 6h6v10h-6V6zm32 0h6v10h-6V6z"/>
    <path d="M12 40h7v9h-7v-9zm33 0h7v9h-7v-9z"/>
